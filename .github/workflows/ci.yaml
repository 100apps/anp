name: ANP 持续集成与多架构镜像
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.7'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: business/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 安装锁定依赖并测试
        run: |
          npm install -g pnpm@11.25.0
          python scripts/manage.py init
          uv sync --project business --frozen
          pnpm --dir business/ui install --frozen-lockfile
          uv run --project business --frozen pytest business/tests tests/integration tests/runtime -q
          pnpm --dir business/ui build
  image:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - name: 释放临时runner的预装SDK空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system df
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 验证固定源码和Dockerfile
        run: |
          python scripts/validate_sources.py
          python scripts/generate_dockerfile.py
          git diff --exit-code -- docker/toolbox/Dockerfile
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          file: docker/toolbox/Dockerfile
          target: toolbox
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          outputs: type=image,push=true,compression=zstd,compression-level=15,force-compression=true
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }}
            type=gha,scope=anp-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }},mode=max,compression=zstd,compression-level=3,ignore-error=true
          provenance: mode=max
          sbom: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.11.7'
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: 在原生架构验收发布候选镜像
        env:
          ANP_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          npm install -g pnpm@11.25.0
          python scripts/manage.py install
          python scripts/manage.py up
          uv run --project business --frozen python scripts/dev.py dev > var/logs/ci-dev.log 2>&1 &
          uv run --project business --frozen python scripts/wait_dev.py
          python scripts/manage.py acceptance
      - name: 保存已验收的不可变镜像digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p var/evidence/digests
          printf '%s\n' "$DIGEST" > "var/evidence/digests/$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digest-${{ matrix.arch }}
          path: var/evidence/digests/*.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-${{ matrix.arch }}
          path: |
            docs/evidence/anp-acceptance.json
            var/logs/ci-dev.log
      - name: 停止本次独立实例
        if: always()
        run: |
          uv run --project business --frozen python scripts/dev.py stop || true
          python scripts/manage.py down || true
  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: /tmp/anp-digests
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 验收通过后合并双架构发布
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          AMD64=$(cat /tmp/anp-digests/amd64.txt)
          ARM64=$(cat /tmp/anp-digests/arm64.txt)
          [[ "$AMD64" =~ ^sha256:[a-f0-9]{64}$ && "$ARM64" =~ ^sha256:[a-f0-9]{64}$ ]]
          tags=(-t "$IMAGE:sha-$REVISION")
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags+=(-t "$IMAGE:latest")
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tags+=(-t "$IMAGE:${GITHUB_REF_NAME}")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          docker buildx imagetools inspect "$IMAGE:sha-$REVISION"
