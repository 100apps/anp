name: 新版持续集成
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anp3-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: 锁定依赖与业务测试
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: business/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 准备锁定依赖和独立配置
        run: |
          npm install --global pnpm@11.25.0
          uv sync --project business --frozen
          pnpm --dir business/ui install --frozen-lockfile
          python scripts/manage.py init
      - name: 业务、代理及 Compose 契约测试
        run: uv run --project business --frozen pytest business/tests tests/integration tests/runtime -q
      - name: 前端生产构建
        run: pnpm --dir business/ui build
      - name: 核对固定 submodule 与配方
        run: |
          python scripts/source_recipes.py
          git diff --exit-code -- docker/platform docker/source-recipes.json
      - name: 保存测试边界
        run: echo '离线模型演示与代理契约测试；真实数据库测试另需显式配置，未调用付费模型。' >> "$GITHUB_STEP_SUMMARY"
