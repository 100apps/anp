name: 验证单组件源码构建
run-name: 组件源码验证 · ${{ inputs.component }}
on:
  workflow_dispatch:
    inputs:
      component:
        description: 单独验证的组件；只保存中间制品，完整流水线验收后才发布平台镜像
        required: true
        default: studio
        type: choice
        options: [studio, langfuse-web, dbx, auth, storage, meta, postgrest, langfuse-worker, litellm, lens]
permissions:
  contents: read
  packages: write
concurrency:
  group: anp-component-probe-${{ inputs.component }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io/100apps
  ANP_BUILD_PROFILE: ci
  COMPONENT: ${{ inputs.component }}
jobs:
  component:
    name: component (${{ inputs.component }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 更新上游并记录实际源码 SHA
        run: python scripts/sync_upstreams.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 为源码编译准备托管运行器磁盘
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/prepare_ci_disk.py --minimum-gb 35
      - name: 从实际源码构建指定组件
        run: python scripts/build_components.py --locked --component "$COMPONENT"
      - name: 保存可供正式流水线验证和复用的中间制品
        run: |
          docker tag "anp-build/$COMPONENT:source" "$REGISTRY/anp-build-$COMPONENT:run-${{ github.run_id }}"
          docker push "$REGISTRY/anp-build-$COMPONENT:run-${{ github.run_id }}"
      - name: 保存源码清单和验收边界
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          manifest=Path('.local/build/dependencies.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as output:
              output.write('仅单组件构建验证；不是平台启动、业务或发布验收。\n\n')
              if manifest.exists():output.write('```json\n'+manifest.read_text()+'\n```\n')
          PY
