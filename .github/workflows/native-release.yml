name: ANP 原生发行

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:
    inputs:
      version:
        description: 可选版本号；留空按运行编号生成
        required: false
        type: string

concurrency:
  group: anp-native-${{ github.ref }}
  # 原生编译耗时较长；让当前运行保存组件缓存后，再验收最新提交。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          major, minor, _ = Path('native/VERSION').read_text().strip().split('.')
          version = os.environ.get('REQUESTED_VERSION') or f"{major}.{minor}.{os.environ['GITHUB_RUN_NUMBER']}"
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?', version), '版本格式无效'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY

  macos:
    needs: version
    # 与当前实体 Mac 对照采用新的官方 ARM64 runner；候选仍须跨主机复验。
    runs-on: macos-26
    timeout-minutes: 180
    env:
      ANP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 释放临时 runner 的非活动 Xcode 与模拟器空间
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          active = Path(subprocess.check_output(['xcode-select', '-p'], text=True).strip()).resolve()
          for app in Path('/Applications').glob('Xcode*.app'):
              if app.is_symlink() or active.is_relative_to(app.resolve()): continue
              subprocess.run(['sudo', 'rm', '-rf', str(app)], check=True)
          simulators = Path('/Library/Developer/CoreSimulator/Profiles/Runtimes')
          if simulators.exists(): subprocess.run(['sudo', 'rm', '-rf', str(simulators)], check=True)
          subprocess.run(['df', '-h', '.'], check=True)
          PYCODE
      - id: native-cache-env
        name: 记录编译器与 SDK 缓存边界
        run: |
          python3 - <<'PY'
          import hashlib, os, platform, subprocess
          from pathlib import Path
          values = [str(Path.cwd()), platform.platform(), os.environ.get('ImageVersion', ''),
                    subprocess.check_output(['/usr/bin/clang', '--version'], text=True),
                    subprocess.check_output(['/usr/bin/xcrun', '--show-sdk-version'], text=True)]
          sdk = hashlib.sha256('\n'.join(values).encode()).hexdigest()[:20]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('sdk=' + sdk + '\n')
          PY
      - id: native-components-cache
        name: 恢复匹配源码与 SDK 的组件编译缓存
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: native-components-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-env.outputs.sdk }}-${{ hashFiles('native/langfuse_build.py', 'native/platform_build.py', 'native/dbx_build.py', 'native/locks/*macos-arm64.json', 'native/packages/*/package-lock.json') }}
          # 旧缓存也必须由构建器复核源码提交、配方与产物摘要，不能跳过验收。
          restore-keys: |
            native-components-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-env.outputs.sdk }}-
          path: |
            var/native/langfuse-build/runtime
            var/native/langfuse-build/work/packages/native
            var/native/cargo-home/registry
            var/native/cargo-home/git
            var/native/rust
            var/native/dbx-target/release/dbx-web
            var/native/dbx-build/build.json
      - name: 恢复失败时清理本轮临时缓存
        if: steps.native-components-cache.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import shutil
          # 全新 runner 尚未构建；此处仅有刚恢复的组件缓存，没有运行数据。
          shutil.rmtree('var/native', ignore_errors=True)
          PY
      - name: 确认原生 ARM64 并构建
        run: |
          test "$(uname -m)" = arm64
          make build NATIVE_TARGET=macos-arm64
          echo "$PWD/var/native/build/anp-macos-arm64/tools/uv" >> "$GITHUB_PATH"
          echo "$PWD/var/native/build/anp-macos-arm64/tools/node/bin" >> "$GITHUB_PATH"
          echo "$PWD/native/packages/business-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: 验收前保存已成功构建的组件
        if: steps.native-components-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.native-components-cache.outputs.cache-primary-key }}
          path: |
            var/native/langfuse-build/runtime
            var/native/langfuse-build/work/packages/native
            var/native/cargo-home/registry
            var/native/cargo-home/git
            var/native/rust
            var/native/dbx-target/release/dbx-web
            var/native/dbx-build/build.json
      - name: 回归与独立目录验收
        run: |
          make test
          make native-check
          mkdir -p var/release/macos-arm64
          cp var/native/evidence/platform/acceptance.json var/release/macos-arm64/macos-arm64-directory.json
      - name: 清理本轮可重建缓存，保留制品与证据
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for path in Path('var/native').iterdir():
              if path.name not in {'build', 'evidence'}:
                  if path.is_dir() and not path.is_symlink(): shutil.rmtree(path)
                  else: path.unlink()
          PY
      - name: 生成并验收真实压缩包
        run: |
          make dist NATIVE_TARGET=macos-arm64
          python3 native/check.py --archive "var/exports/anp-$ANP_VERSION-macos-arm64.tar.gz"
          cp var/native/evidence/platform/acceptance.json var/release/macos-arm64/macos-arm64-archive.json
          cp var/exports/*.tar.gz var/exports/*.sha256 var/release/macos-arm64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-macos-arm64
          path: var/release/macos-arm64/
          compression-level: 0
          if-no-files-found: error

      - name: 保存失败的构建日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-diagnostics-macos
          path: |
            var/native/evidence/platform/
            var/native/langfuse-*.log
            var/native/dbx-*.log
            var/native/redis-build.log
            var/native/native-tools.log
          if-no-files-found: ignore

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ANP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 释放临时 runner 的预装 SDK 空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: 在独立 Debian 构建容器中编译
        run: |
          test "$(uname -m)" = x86_64
          make native-sources NATIVE_TARGET=linux-amd64
          docker build --build-arg BUILD_UID="$(id -u)" --build-arg BUILD_GID="$(id -g)" -f native/linux/Dockerfile.builder -t anp-native-builder:ci native/linux
          docker run --rm --name anp-native-build-ci -e ANP_VERSION -v "$PWD:/workspace" anp-native-builder:ci make build NATIVE_TARGET=linux-amd64
          echo "$PWD/var/native/build/anp-linux-amd64/tools/uv" >> "$GITHUB_PATH"
          echo "$PWD/var/native/build/anp-linux-amd64/tools/node/bin" >> "$GITHUB_PATH"
          echo "$PWD/native/packages/business-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - name: 清理已组装的构建缓存，为干净副本与归档留出空间
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for path in Path('var/native').iterdir():
              if path.name not in {'build', 'evidence'}:
                  if path.is_dir() and not path.is_symlink(): shutil.rmtree(path)
                  else: path.unlink()
          PY
          df -h .
      - name: 在 Debian 和 Alpine 干净容器中验收
        run: |
          make native-check NATIVE_TARGET=linux-amd64
          mkdir -p var/release/linux-amd64
          cp var/native/evidence/linux/*-directory.json var/release/linux-amd64/
      - name: 生成压缩包并在两个干净容器中复验
        run: |
          make dist NATIVE_TARGET=linux-amd64
          python3 native/linux_check.py --archive "var/exports/anp-$ANP_VERSION-linux-amd64.tar.gz"
          cp var/native/evidence/linux/*-archive.json var/release/linux-amd64/
          cp var/exports/*.tar.gz var/exports/*.sha256 var/release/linux-amd64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-linux-amd64
          path: var/release/linux-amd64/
          compression-level: 0
          if-no-files-found: error

      - name: 保存失败的构建日志
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-diagnostics-linux
          path: |
            var/native/evidence/linux/
            var/native/langfuse-*.log
            var/native/dbx-*.log
            var/native/redis-build.log
            var/native/native-tools.log
          if-no-files-found: ignore

  release:
    if: github.ref == 'refs/heads/main'
    needs: [version, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ANP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - name: 校验版本、压缩包与验收回执
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('artifacts')
          version = os.environ['ANP_VERSION']
          for target in ('macos-arm64', 'linux-amd64'):
              archive = root / f'anp-{version}-{target}.tar.gz'
              assert archive.stat().st_size < 2 * 1024**3, '单个 Release 资产不能超过 2 GiB'
              expected = archive.with_suffix('.gz.sha256').read_text().split()[0]
              assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == expected
          receipts = list(root.glob('*.json'))
          assert len(receipts) == 6, '缺少完整的目录或压缩包验收回执'
          values = [json.loads(path.read_text()) for path in receipts]
          assert all(value['passed'] and value['version'] == version for value in values)
          for target, count in [('macos-arm64', 2), ('linux-amd64', 4)]:
              group = [value for value in values if value['target'] == target]
              assert len(group) == count
              assert len({value['bundle_files_manifest_sha256'] for value in group}) == 1, '目录与归档的制品清单不一致'
          Path('release-notes.md').write_text('Mac ARM64 与 Linux x64 原生发行包。\n\n解压后执行 ./anp verify、./anp start，进入 [ANP 工作台](http://127.0.0.1:58000/workbench/)。\n\nAgent Server 单入口，内置平台控制台、Supabase、DBX、Langfuse、LiteLLM、RustFS 与可复制的 business/；保留管理员及上游 API 鉴权。OTel/LGTM 五组件可选，Grafana 使用 PostgreSQL。OAuth 默认不填。\n\n原生验收代码统一在 native/checks/；修复 Linux 含空格路径的 NSS 预载。Realtime、Pyroscope、eBPF 与 Intel Mac 暂不包含；业务 Demo 默认使用离线模型。\n\n本候选通过 CI 的目录与真实解压包验收；仍需下载到目标实体 Mac 与 Linux 测试机复验后转为正式版本。Linux 在禁用外网的 Debian、Alpine 干净容器验证。六份回执与 SHA256 随附件提供。\n')
          PY
      - name: 上传草稿、核对服务端摘要后发布
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'native-v' + os.environ['ANP_VERSION']
          files = sorted(Path('artifacts').iterdir())
          expected = {path.name: {'size': path.stat().st_size,
                      'digest': 'sha256:' + hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()} for path in files}
          def api(endpoint, payload=None):
              args = ['gh', 'api', endpoint]
              if payload is None:
                  return json.loads(subprocess.check_output(args))
              return json.loads(subprocess.check_output([*args, '--method', 'PATCH', '--input', '-'],
                                input=json.dumps(payload).encode()))
          def find_release():
              pages = json.loads(subprocess.check_output(['gh', 'api', '--paginate', '--slurp',
                                 f'repos/{repo}/releases?per_page=100']))
              matches = [item for page in pages for item in page if item['tag_name'] == tag]
              assert len(matches) <= 1, '同一版本存在多个 Release'
              return matches[0] if matches else None
          release = find_release()
          if release is None:
              args = ['gh', 'release', 'create', tag, '--repo', repo, '--draft', '--prerelease', '--target', os.environ['GITHUB_SHA'], '--title', 'ANP ' + os.environ['ANP_VERSION'] + '（候选）', '--notes-file', 'release-notes.md']
              subprocess.run([*args, *map(str, files)], check=True)
              release = find_release()
          assert release is not None, '创建后未找到 Release'
          assert release['target_commitish'] == os.environ['GITHUB_SHA'], '已有 Release 的源码提交不一致'
          # 新标签在草稿公开前可能不存在，必须用不可变 Release ID 查询和发布。
          endpoint = f"repos/{repo}/releases/{release['id']}"
          release = api(endpoint)
          assets = {item['name']: item for item in release['assets']}
          pending = [path for path in files if assets.get(path.name, {}).get('digest') != expected[path.name]['digest']
                     or assets.get(path.name, {}).get('size') != expected[path.name]['size']]
          if pending and release['draft']:
              subprocess.run(['gh', 'release', 'upload', tag, '--repo', repo, '--clobber', *map(str, pending)], check=True)
              release = api(endpoint)
          assets = {item['name']: item for item in release['assets']}
          assert set(assets) == set(expected), 'Release 附件集合不一致'
          for path in files:
              asset = assets[path.name]
              assert asset.get('digest') == expected[path.name]['digest'] and asset['size'] == expected[path.name]['size'], '服务端制品摘要不一致'
          if release['draft']:
              release = api(endpoint, {'draft': False})
          assert release['draft'] is False, 'Release 尚未公开'
          PY
