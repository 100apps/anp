name: 新版平台源码镜像
on:
  workflow_dispatch:
    inputs:
      component:
        description: 选择独立组件；all 构建全部九个组件，不组装单体镜像
        type: choice
        default: dbx
        options: [dbx, langfuse-web, langfuse-worker, litellm, supabase-studio, supabase-auth, supabase-rest, supabase-meta, supabase-storage, all]
      publish:
        description: 构建成功后发布 SHA 镜像到 GHCR
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: anp2-platform-${{ github.ref }}-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: matrix
        env:
          ANP_CI_COMPONENT: ${{ inputs.component }}
        run: python scripts/ci_platform_matrix.py >> "$GITHUB_OUTPUT"
  build:
    name: 源码构建（${{ matrix.name }}）
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - name: 为生产源码构建准备托管运行器磁盘
        run: python scripts/ci_runner_space.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 核对固定源码与生产配方
        run: |
          python scripts/source_recipes.py
          git diff --exit-code -- docker/platform docker/source-recipes.json
      - name: 从固定源码构建独立组件
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: ${{ inputs.publish }}
          tags: ghcr.io/100apps/anp2-${{ matrix.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/100apps/anp
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=platform-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=platform-${{ matrix.name }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: 源码配方-${{ matrix.name }}
          path: docker/source-recipes.json
