name: 构建与验收单容器平台
on:
  workflow_dispatch:
    inputs:
      component_cache_run:
        description: 候选平台或组件构建编号，逗号分隔最多四个；仅复用同源码和配方制品
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
permissions:
  actions: read
  contents: read
  packages: write
concurrency:
  group: anp-platform-release
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io/100apps
  ANP_BUILD_PROFILE: ci
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    outputs:
      manifest: ${{ steps.resolve.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 拉取所有最新上游并记录真实 SHA
        id: resolve
        run: |
          python scripts/sync_upstreams.py
          echo "manifest=$(base64 -w0 .local/build/dependencies.json)" >> "$GITHUB_OUTPUT"
  component:
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        name: [studio, dbx, auth, storage, meta, postgrest, langfuse-web, langfuse-worker, litellm, lens]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 复原同一份构建清单
        env:
          DEPENDENCIES_BASE64: ${{ needs.dependencies.outputs.manifest }}
        run: python -c "import os,base64;from pathlib import Path;p=Path('.local/ci/dependencies.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(os.environ['DEPENDENCIES_BASE64']))"
      - run: python scripts/checkout_dependencies.py .local/ci/dependencies.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查可复用的同源码组件
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPONENT_CACHE_RUN: ${{ inputs.component_cache_run }}
        run: python scripts/reuse_component.py --component '${{ matrix.name }}' --run "$COMPONENT_CACHE_RUN"
      - name: 记录实际运行器资源，辅助区分编译错误和资源问题
        run: python -c "import os,json,shutil;from pathlib import Path;p=Path('/sys/fs/cgroup/memory.max');print(json.dumps({'cpus':os.cpu_count(),'disk_free_gb':round(shutil.disk_usage('/').free/2**30,2),'memory_gb':round(os.sysconf('SC_PHYS_PAGES')*os.sysconf('SC_PAGE_SIZE')/2**30,2),'cgroup_memory_max':p.read_text().strip() if p.exists() else None}))"
      - name: 为源码编译准备托管运行器磁盘
        if: steps.reuse.outputs.hit != 'true'
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/prepare_ci_disk.py --minimum-gb 35 --extra-swap-gb ${{ (matrix.name == 'langfuse-web' || matrix.name == 'dbx') && '8' || '0' }}
      - name: 从记录的最新源码构建组件
        if: steps.reuse.outputs.hit != 'true'
        run: python scripts/build_components.py --locked --component '${{ matrix.name }}'
      - name: 保存本次构建的中间制品
        run: |
          docker tag anp-build/${{ matrix.name }}:source $REGISTRY/anp-build-${{ matrix.name }}:run-${{ github.run_id }}
          docker push $REGISTRY/anp-build-${{ matrix.name }}:run-${{ github.run_id }}
  platform:
    needs: [dependencies, component]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 为镜像组装准备托管运行器磁盘
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/prepare_ci_disk.py --minimum-gb 35 --extra-swap-gb 8
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: 复原同一份构建清单
        env:
          DEPENDENCIES_BASE64: ${{ needs.dependencies.outputs.manifest }}
        run: python -c "import os,base64;from pathlib import Path;p=Path('.local/ci/dependencies.json');p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(os.environ['DEPENDENCIES_BASE64']))"
      - run: python scripts/checkout_dependencies.py .local/ci/dependencies.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 拉取中间制品并组装唯一平台镜像
        run: |
          for name in studio dbx auth storage meta postgrest langfuse-web langfuse-worker litellm lens; do
            docker pull "$REGISTRY/anp-build-$name:run-${{ github.run_id }}"
            docker tag "$REGISTRY/anp-build-$name:run-${{ github.run_id }}" "anp-build/$name:source"
          done
          uv sync --frozen
          uv run python scripts/bundle_platform.py --tag anp/platform:ci
      - name: 生成隔离配置并实启四存储与单平台
        run: |
          uv run python -c "from pathlib import Path;p=Path('config/deployment.example.toml').read_text();Path('config/deployment.local.toml').write_text(p.replace('127.0.0.1:8080','127.0.0.1:8089').replace('ghcr.io/100apps/anp-platform:latest','anp/platform:ci').replace(':8180',':8181').replace(':8281',':8282').replace(':5173',':5174'))"
          uv run python -m anp.dev.v3 prepare --mode docker
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          install: false
          cache: true
      - name: 验证工作台 TypeScript 与生产构建
        env:
          VITE_BASE_PATH: /workbench/
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir console build
      - name: 验证前端独立启动、真实 HMR 与退出
        env:
          ANP_DEV_HOST: '0.0.0.0'
        run: uv run python scripts/verify_frontend_runtime.py --output .local/ci/frontend-runtime.json
      - name: 在镜像外启动示例 API、Worker 与工作台
        env:
          ANP_DEV_HOST: '0.0.0.0'
        run: |
          uv run python -m anp.dev.v3 api > .local/ci-api.log 2>&1 &
          uv run python -m anp.dev.v3 worker > .local/ci-worker.log 2>&1 &
          uv run python -m anp.dev.v3 frontend-ready > .local/ci-web-ready.log 2>&1
      - name: 验收真实管理接口、登录、连接与状态交接契约
        env:
          ANP_V3_PLATFORM_SMOKE: '1'
          ANP_V3_BUSINESS_SMOKE: '1'
          ANP_SKIP_LIVE_LLM: '1'
        run: >-
          uv run pytest tests/test_v3_runtime.py tests/test_v3_handoff.py tests/test_v3_native_artifacts.py tests/test_v3_bridge.py
          tests/test_v3_agent_contract.py tests/test_v3_coordinator.py tests/test_v3_http_client.py
          tests/test_v3_bindings.py tests/test_v3_component_reuse.py tests/test_v3_ci_resources.py tests/test_v3_frontend.py tests/test_v3_platform_live.py
          tests/test_v3_business_live.py tests/test_v3_task_summary.py tests/test_01_local_cli.py tests/test_02_http_acl.py
          tests/test_05_observability.py tests/test_06_studio.py -q --tb=short
      - name: 验收后发布平台镜像
        run: |
          docker tag anp/platform:ci $REGISTRY/anp-platform:sha-${{ github.sha }}
          docker tag anp/platform:ci $REGISTRY/anp-platform:latest
          docker push $REGISTRY/anp-platform:sha-${{ github.sha }}
          docker push $REGISTRY/anp-platform:latest
      - name: 保存构建清单到作业摘要（镜像内也包含该清单）
        if: always()
        run: |
          echo '### 实际依赖 SHA' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .local/build/dependencies.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
