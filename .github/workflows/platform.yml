name: 构建与验收单容器平台
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: anp-platform-release
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io/100apps
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 拉取所有最新上游并记录真实 SHA
        run: python scripts/sync_upstreams.py
      - uses: actions/upload-artifact@v4
        with:
          name: platform-dependencies
          path: .local/build/dependencies.json
          include-hidden-files: true
  component:
    needs: dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        name: [studio, dbx, auth, storage, meta, postgrest, langfuse-web, langfuse-worker, litellm, lens]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: platform-dependencies
          path: .local/ci
      - run: python scripts/checkout_dependencies.py .local/ci/dependencies.json
      - name: 从记录的最新源码构建组件
        run: python scripts/build_components.py --locked --component '${{ matrix.name }}'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 保存本次构建的中间制品
        run: |
          docker tag anp-build/${{ matrix.name }}:source $REGISTRY/anp-build-${{ matrix.name }}:run-${{ github.run_id }}
          docker push $REGISTRY/anp-build-${{ matrix.name }}:run-${{ github.run_id }}
  platform:
    needs: component
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: platform-dependencies
          path: .local/ci
      - run: python scripts/checkout_dependencies.py .local/ci/dependencies.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 拉取中间制品并组装唯一平台镜像
        run: |
          for name in studio dbx auth storage meta postgrest langfuse-web langfuse-worker litellm lens; do
            docker pull "$REGISTRY/anp-build-$name:run-${{ github.run_id }}"
            docker tag "$REGISTRY/anp-build-$name:run-${{ github.run_id }}" "anp-build/$name:source"
          done
          uv sync --frozen
          uv run python scripts/bundle_platform.py --tag anp/platform:ci
      - name: 生成隔离配置并实启四存储与单平台
        run: |
          uv run python -c "from pathlib import Path;p=Path('config/deployment.example.toml').read_text();Path('config/deployment.local.toml').write_text(p.replace('localhost:8080','localhost:8089').replace('ghcr.io/100apps/anp-platform:latest','anp/platform:ci').replace(':8180',':8181').replace(':8281',':8282').replace(':5173',':5174'))"
          uv run python -m anp.dev.v3 prepare --mode docker
      - name: 在镜像外启动示例 API 与 Worker
        env:
          ANP_DEV_HOST: '0.0.0.0'
        run: |
          uv run python -m anp.dev.v3 api > .local/ci-api.log 2>&1 &
          uv run python -m anp.dev.v3 worker > .local/ci-worker.log 2>&1 &
          uv run python -c "from anp.dev.v3 import wait_health;wait_health('http://127.0.0.1:8181/health');wait_health('http://127.0.0.1:8282/health')"
      - name: 验收真实管理接口、登录、连接与状态交接契约
        env:
          ANP_V3_PLATFORM_SMOKE: '1'
          ANP_V3_BUSINESS_SMOKE: '1'
          ANP_SKIP_LIVE_LLM: '1'
        run: >-
          uv run pytest tests/test_v3_runtime.py tests/test_v3_handoff.py tests/test_v3_bridge.py
          tests/test_v3_agent_contract.py tests/test_v3_bindings.py tests/test_v3_platform_live.py
          tests/test_v3_business_live.py -q --tb=short
      - name: 验收后发布平台镜像
        run: |
          docker tag anp/platform:ci $REGISTRY/anp-platform:sha-${{ github.sha }}
          docker tag anp/platform:ci $REGISTRY/anp-platform:latest
          docker push $REGISTRY/anp-platform:sha-${{ github.sha }}
          docker push $REGISTRY/anp-platform:latest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-release-manifest
          path: |
            .local/build/dependencies.json
            .local/build/platform/components.json
          include-hidden-files: true
