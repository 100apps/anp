name: 验证托管运行器磁盘容量
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: 记录文件系统容量
        run: df -hT / /mnt /var/lib/docker
      - name: 验证与镜像组装相同的空间门槛
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/prepare_ci_disk.py --minimum-gb 35
