id = "deep_dub"
name = "视频译配"
description = "来源、分段、候选版本、阶段执行与质量审核"
version = "0.1.0"
enabled = true

[menu]
title = "视频译配"
icon = "AudioLines"
order = 110

[api]
entry = "apps.deep_dub.api.router:router"

[worker]
entry = "apps.deep_dub.api.worker:router"

[cli]
entry = "apps.deep_dub.cli:app"

[execution]
owner = "business"

[flow]
entry = "apps.deep_dub.flow.decode:build_decode_graph"
deployment_entry = "apps.deep_dub.flow.deployment:graph"
deployment = "deep-dub-local"

[services]
entry = "apps.deep_dub.services.workbench:service"

[ui]
entry = "ui/index.tsx"

[permissions]
actions = ["task.read", "task.create", "task.run", "task.cancel", "project.read", "project.create", "project.edit", "audit", "publish"]
