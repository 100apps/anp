id = "demo"
name = "文本分析"
description = "规范化文本、提取统计信息并保存报告"
version = "1.0.0"
enabled = true

[menu]
title = "文本分析"
icon = "FileText"
order = 100

[api]
entry = "apps.demo.api.router:router"

[nodes]
entry = "apps.demo.nodes.registry:NODES"

[evaluation]
entry = "apps.demo.evaluators:score_node"

[flow]
entry = "apps.demo.flow.graph:build_graph"
deployment = "demo-local"
studio_entry_node = "normalize"
studio_payload_fields = ["text", "title"]

[services]
entry = "apps.demo.services.tasks:service"

[ui]
entry = "ui/index.tsx"

[permissions]
actions = ["task.read", "task.create", "task.run", "task.cancel"]
