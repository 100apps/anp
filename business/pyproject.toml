[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anp-business"
version = "0.1.0"
description = "可插拔 AI 工作台与两个业务演示"
requires-python = ">=3.12,<3.14"
dependencies = [
  "langchain>=1,<2", "langgraph>=1,<2", "deepagents>=0.4,<1",
  "langchain-openai>=1,<2",
  "fastapi>=0.115,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2",
  "langgraph-cli[inmem]>=0.4,<0.5",
  "langgraph-runtime-inmem==0.36.1", "websockets>=15,<17"
]

[dependency-groups]
demo = ["langgraph-cli[inmem]>=0.4,<0.5"]
build = ["hatchling>=1.27,<2"]
dev = [{include-group = "demo"}, "pytest>=8,<10", "pytest-asyncio>=1,<2", "debugpy>=1.8,<2", "psutil>=7,<8", "ruff>=0.14,<1", "zstandard==0.25.0", "psycopg[binary]>=3.2.8,<=3.3.3", "redis>=6,<8", "boto3>=1.40,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/anp_business"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = false
