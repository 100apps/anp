name: anp3
services:
  dbx:
    image: anp3/dbx:source
    build:
      context: ./platform/sources/dbx
      dockerfile: ../../../docker/platform/dbx/Dockerfile
      args: {VITE_DBX_BASE_PATH: /dbx}
  langfuse-web:
    image: anp3/langfuse-web:source
    build:
      context: ./platform/sources/langfuse
      dockerfile: ../../../docker/platform/langfuse/web.Dockerfile
      args: {NEXT_PUBLIC_BASE_PATH: /langfuse}
  langfuse-worker:
    image: anp3/langfuse-worker:source
    build:
      context: ./platform/sources/langfuse
      dockerfile: ../../../docker/platform/langfuse/worker.Dockerfile
  litellm:
    image: anp3/litellm:source
    build:
      context: ./platform/sources/litellm
      dockerfile: ../../../docker/platform/litellm/Dockerfile
  supabase-studio:
    image: anp3/supabase-studio:source
    build:
      context: ./platform/sources/supabase
      dockerfile: ../../../docker/platform/supabase/studio.Dockerfile
      target: production
      args: {NEXT_PUBLIC_BASE_PATH: /supabase}
  supabase-auth:
    image: anp3/supabase-auth:source
    build:
      context: ./platform/sources/components/auth
      dockerfile: ../../../../docker/platform/supabase/auth.Dockerfile
  supabase-rest:
    image: anp3/supabase-rest:source
    build:
      context: ./platform/sources/components/postgrest
      dockerfile: ../../../../docker/platform/supabase/rest.Dockerfile
  supabase-meta:
    image: anp3/supabase-meta:source
    build:
      context: ./platform/sources/components/postgres-meta
      dockerfile: ../../../../docker/platform/supabase/meta.Dockerfile
  supabase-storage:
    image: anp3/supabase-storage:source
    build:
      context: ./platform/sources/components/storage
      dockerfile: ../../../../docker/platform/supabase/storage.Dockerfile
