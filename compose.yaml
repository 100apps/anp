name: ${ANP_COMPOSE_PROJECT:-anp-next}
services:
  toolbox:
    labels:
      dev.anp.workspace: ${ANP_WORKSPACE_ID:-uninitialized}
    image: ${ANP_IMAGE:-ghcr.io/100apps/anp:latest}
    env_file: [.env]
    environment:
      ANP_SERVICES: ${ANP_SERVICES:-all}
      ANP_AUTO_DEPS: ${ANP_AUTO_DEPS:-1}
      ANP_MEMORY_MB: ${ANP_MEMORY_MB:-16384}
      ANP_CPU_THREADS: ${ANP_CPU_THREADS:-8}
      ANP_PUBLIC_URL: ${ANP_PUBLIC_URL:-http://127.0.0.1:51760}
    volumes: ['${ANP_DATA_ROOT:-./var/data}:/data']
    ports:
      - '127.0.0.1:${PG_PORT:-57432}:5432'
      - '127.0.0.1:${REDIS_PORT:-57379}:6379'
      - '127.0.0.1:${CH_PORT:-59223}:8123'
      - '127.0.0.1:${CH_NATIVE_PORT:-59400}:9000'
      - '127.0.0.1:${S3_API_PORT:-59402}:9002'
      - '127.0.0.1:${S3_CONSOLE_PORT:-59403}:9003'
      - '127.0.0.1:${DBX_PORT:-54424}:4224'
      - '127.0.0.1:${LANGFUSE_PORT:-53400}:3100'
      - '127.0.0.1:${LITELLM_PORT:-54400}:4000'
      - '127.0.0.1:${STUDIO_PORT:-53401}:3200'
      - '127.0.0.1:${SUPABASE_API_PORT:-58400}:8000'
      - '127.0.0.1:${HEALTH_PORT:-57501}:9750'
    mem_limit: ${ANP_MEMORY_MB:-16384}m
    cpus: ${ANP_CPU_THREADS:-8}
    shm_size: 256mb
    ulimits:
      nofile: {soft: 262144, hard: 262144}
      nproc: 65536
    init: true
    restart: unless-stopped
    stop_grace_period: 150s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
