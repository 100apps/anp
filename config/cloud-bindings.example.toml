# 将需要的段落合并到 settings.local.toml，不要直接覆盖完整配置。
# 示例只演示 Redis/S3/ClickHouse 外置；替换占位地址与私有 env 后使用。
[deployment]
external_services = ["redis", "rustfs", "rustfs-volume-init", "clickhouse", "litellm-tracing-init"]

# 云端预建 litellm 数据库及写入/只读账号；不再运行本地初始化容器。
[deployment.environment.litellm]
CLICKHOUSE_DATABASE = "litellm"
CLICKHOUSE_URL = "https://litellm_writer:${LITELLM_CH_WRITE_PASSWORD}@clickhouse.example.internal:8443"
CLICKHOUSE_READER_URL = "https://litellm_reader:${LITELLM_CH_READ_PASSWORD}@clickhouse.example.internal:8443"

[deployment.environment.langfuse-web]
REDIS_HOST = "redis.example.internal"
REDIS_PORT = "6379"
REDIS_AUTH = "${REDIS_PASSWORD}"
REDIS_TLS_ENABLED = "true"
CLICKHOUSE_URL = "https://clickhouse.example.internal:8443"
CLICKHOUSE_MIGRATION_URL = "clickhouses://clickhouse.example.internal:9440"
CLICKHOUSE_USER = "anp"
CLICKHOUSE_PASSWORD = "${CH_PASSWORD}"
LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT = "https://s3.example.internal"
LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT = "https://s3.example.internal"
LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT = "https://s3.example.internal"
LANGFUSE_S3_BATCH_EXPORT_ENDPOINT = "https://s3.example.internal"
LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT = "https://s3.example.internal"

[deployment.environment.langfuse-worker]
REDIS_HOST = "redis.example.internal"
REDIS_PORT = "6379"
REDIS_AUTH = "${REDIS_PASSWORD}"
REDIS_TLS_ENABLED = "true"
CLICKHOUSE_URL = "https://clickhouse.example.internal:8443"
CLICKHOUSE_MIGRATION_URL = "clickhouses://clickhouse.example.internal:9440"
CLICKHOUSE_USER = "anp"
CLICKHOUSE_PASSWORD = "${CH_PASSWORD}"
LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT = "https://s3.example.internal"
LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT = "https://s3.example.internal"
LANGFUSE_S3_BATCH_EXPORT_ENDPOINT = "https://s3.example.internal"

[deployment.environment.storage]
GLOBAL_S3_ENDPOINT = "https://s3.example.internal"
GLOBAL_S3_PROTOCOL = "https"

[deployment.environment.storage-init]
S3_ENDPOINT = "https://s3.example.internal"
S3_REGION = "us-east-1"

# DBX 云连接列表会替换默认六个本地连接，因此应列出希望保留的全部连接。
[[deployment.dbx_connections]]
id = "anp-cloud-redis"
name = "云 Redis"
db_type = "redis"
host = "redis.example.internal"
port = 6379
username = "default"
password = "${REDIS_PASSWORD}"
database = "0"
save_password = true
# TLS 等驱动选项以当前 DBX 驱动配置为准，在 DBX 页面检查后保存。
