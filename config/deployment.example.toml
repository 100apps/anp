# V3 目标配置：宿主/F5 与容器连接分别明确，不猜测 localhost 的含义。
[platform]
url = "http://127.0.0.1:8080"
listen = "0.0.0.0:8080"
image = "ghcr.io/100apps/anp-platform:latest"

[storage]
local = ["postgres", "redis", "clickhouse", "rustfs"]
volume_prefix = "anp_v3"
postgres_host_url = "postgresql://supabase_admin:${POSTGRES_PASSWORD}@127.0.0.1:54322/postgres"
postgres_container_url = "postgresql://supabase_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres"
redis_host_url = "redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0"
redis_container_url = "redis://:${REDIS_PASSWORD}@redis:6379/0"
clickhouse_host_url = "http://127.0.0.1:8123"
clickhouse_container_url = "http://clickhouse:8123"
clickhouse_host_migration_url = "clickhouse://127.0.0.1:19000"
clickhouse_container_migration_url = "clickhouse://clickhouse:9000"
s3_host_url = "http://127.0.0.1:9000"
s3_container_url = "http://rustfs:9000"
s3_access_key = "${S3_ACCESS_KEY}"
s3_secret_key = "${S3_SECRET_KEY}"
s3_region = "us-east-1"
initialize_databases = true
initialize_buckets = true

# 托管 PostgreSQL 的预建服务账号可独立覆盖 DSN，完整 URL 放在私有 env 中。
# [postgres.urls]
# auth = "${CLOUD_AUTH_DATABASE_URL}"
# storage = "${CLOUD_STORAGE_DATABASE_URL}"
# postgrest = "${CLOUD_REST_DATABASE_URL}"
# langfuse = "${CLOUD_LANGFUSE_DATABASE_URL}"
# litellm = "${CLOUD_LITELLM_DATABASE_URL}"

[business]
api_host_url = "http://127.0.0.1:8180"
api_container_url = "http://host.docker.internal:8180"
worker_host_url = "http://127.0.0.1:8281"
worker_container_url = "http://host.docker.internal:8281"
ui_host_url = "http://127.0.0.1:5173"
ui_container_url = "http://host.docker.internal:5173"

[lens]
# 分析 Key 仍只允许 auto；支持分析器较长的系统提示与连续工具调用。
analysis_rpm_limit = 20
analysis_tpm_limit = 100000

[agent]
# 当前 demo 实测提高到 4 未改善吞吐，保留 1；按真实业务基准调整。
# CPU/GPU 密集节点仍须由业务执行器限制设备并发。
max_concurrent_runs = 1
