static_resources:
  listeners:
    - name: api
      address: {socket_address: {address: 0.0.0.0, port_value: 8000}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: supabase
                route_config:
                  name: api
                  virtual_hosts:
                    - name: supabase
                      domains: ['*']
                      routes:
                        - match: {prefix: /auth/v1/}
                          route: {cluster: auth, prefix_rewrite: /}
                        - match: {prefix: /rest/v1/}
                          route: {cluster: rest, prefix_rewrite: /}
                        - match: {prefix: /storage/v1/}
                          route: {cluster: storage, prefix_rewrite: /}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: {'@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
    - name: auth
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: auth
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: supabase-auth, port_value: 9999}}}}]}]
    - name: rest
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: rest
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: supabase-rest, port_value: 3000}}}}]}]
    - name: storage
      type: STRICT_DNS
      connect_timeout: 3s
      load_assignment:
        cluster_name: storage
        endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: supabase-storage, port_value: 5000}}}}]}]
