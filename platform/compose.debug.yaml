services:
  agent-demo:
    environment:
      PYDEVD_USE_CYTHON: 'NO'
      PYDEVD_USE_FRAME_EVAL: 'NO'
    volumes:
    - ../:/workspace
    ports:
    - 127.0.0.1:5678:5678
    command:
    - langgraph
    - dev
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --no-browser
    - --config
    - /workspace/platform/config/agents/demo.generated.json
    - --debug-port
    - '5678'
    - --allow-blocking
    - --no-reload
    - --wait-for-client
