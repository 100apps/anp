<h1>ANP 平台工作台</h1><p>统一入口 · 存储服务独立 · 业务在本机调试</p><div class="grid"><a href="/supabase/">Supabase 管理</a><a href="/dbx/">DBX 数据管理</a><a href="/langfuse/">Langfuse 观测</a><a href="/litellm/ui/">LiteLLM 模型网关</a><a href="/lens/ui/">Lens 分析</a><a href="/demo/">Demo 业务</a></div><h2>组件状态</h2><pre id="status">正在检查…</pre><small>管理后台保留各自的登录校验；没有启动的业务请通过 F5 运行。</small><script>fetch('/_platform/services').then(r=>r.json()).then(x=>document.querySelector('#status').textContent=Object.entries(x.services).map(([name,s])=>name+'  '+s.status).join('\n')).catch(()=>document.querySelector('#status').textContent='状态接口暂不可用')</script></html>
